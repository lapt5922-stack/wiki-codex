<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="sky" cx="68%" cy="32%" r="72%">
      <stop offset="0%" stop-color="#2a354d"/>
      <stop offset="45%" stop-color="#182032"/>
      <stop offset="100%" stop-color="#0d121e"/>
    </radialGradient>
    <radialGradient id="goldGlow" cx="68%" cy="36%" r="36%">
      <stop offset="0%" stop-color="#C6A568" stop-opacity="0.34"/>
      <stop offset="55%" stop-color="#6D3D49" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#101522" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="archGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E9DFC9" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#C6A568" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="floorFade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#101522" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0.96"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#goldGlow)"/>
  <!-- Starfield -->
  <g fill="#E9DFC9" opacity="0.55">
    <circle cx="210" cy="140" r="1.5"/><circle cx="340" cy="95" r="1.2"/><circle cx="510" cy="180" r="1.8"/>
    <circle cx="760" cy="110" r="1.4"/><circle cx="940" cy="80" r="2"/><circle cx="1180" cy="130" r="1.6"/>
    <circle cx="1360" cy="90" r="1.5"/><circle cx="1470" cy="210" r="1.8"/><circle cx="1290" cy="240" r="1.2"/>
    <circle cx="880" cy="210" r="1.4"/><circle cx="640" cy="135" r="1.1"/><circle cx="1040" cy="175" r="1.7"/>
  </g>
  <!-- Celestial Astrolabe / Observatory Dome -->
  <g transform="translate(1090 340)" fill="none" stroke="#C6A568">
    <circle r="270" stroke-opacity="0.22" stroke-width="1.5"/>
    <circle r="225" stroke-opacity="0.32" stroke-width="1" stroke-dasharray="4 8"/>
    <circle r="175" stroke-opacity="0.48" stroke-width="1.5"/>
    <circle r="120" stroke-opacity="0.35" stroke-width="1"/>
    <ellipse rx="270" ry="96" transform="rotate(-18)" stroke-opacity="0.38" stroke-width="1.2"/>
    <ellipse rx="225" ry="72" transform="rotate(24)" stroke-opacity="0.28" stroke-width="1"/>
    <line x1="-320" y1="0" x2="320" y2="0" stroke-opacity="0.2"/>
    <line x1="0" y1="-320" x2="0" y2="320" stroke-opacity="0.2"/>
    <circle r="26" fill="#C6A568" fill-opacity="0.2" stroke-opacity="0.8" stroke-width="1.5"/>
    <circle r="6" fill="#E9DFC9"/>
  </g>
  <!-- Imperial Library Gothic Arches -->
  <g fill="none" stroke="url(#archGold)" stroke-width="2">
    <path d="M80 900 V340 Q260 120 440 340 V900" opacity="0.45"/>
    <path d="M440 900 V280 Q760 40 1080 280 V900" opacity="0.38"/>
    <path d="M1080 900 V320 Q1320 110 1560 320 V900" opacity="0.45"/>
  </g>
  <!-- Architectural Columns & Bookcase Silhouettes -->
  <g fill="#121929" stroke="#C6A568" stroke-opacity="0.18">
    <rect x="65" y="340" width="38" height="560"/>
    <rect x="422" y="290" width="42" height="610"/>
    <rect x="1060" y="290" width="42" height="610"/>
    <rect x="1505" y="330" width="38" height="570"/>
  </g>
  <!-- Warm Lantern Points -->
  <g>
    <circle cx="260" cy="430" r="34" fill="#C6A568" opacity="0.16"/>
    <circle cx="260" cy="430" r="4" fill="#E9DFC9"/>
    <circle cx="760" cy="390" r="44" fill="#C6A568" opacity="0.18"/>
    <circle cx="760" cy="390" r="5" fill="#E9DFC9"/>
    <circle cx="1320" cy="430" r="34" fill="#C6A568" opacity="0.16"/>
    <circle cx="1320" cy="430" r="4" fill="#E9DFC9"/>
  </g>
  <rect y="560" width="1600" height="340" fill="url(#floorFade)"/>
</svg>
